quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USERNAME:users}
%dev.quarkus.datasource.password=${DB_PASSWORD:password}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5434/users}

# Production has no defaults: DB_URL, DB_USERNAME and DB_PASSWORD must be provided.
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Tests run against a disposable PostgreSQL container (Dev Services), never against DB_URL.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17
%test.quarkus.compose.devservices.enabled=false

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:database/migration
